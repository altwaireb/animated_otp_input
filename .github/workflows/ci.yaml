name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - label: '3.32.x'
            flutter-version: '3.32.x'
            use-latest: false
          - label: 'latest'
            use-latest: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (minimum supported)
        if: matrix.use-latest == false
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}

      - name: Set up Flutter (latest stable)
        if: matrix.use-latest == true
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        if: matrix.use-latest == true
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.label }}
          path: build/test-results/
